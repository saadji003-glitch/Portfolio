<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <radialGradient id="neonGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad)" rx="32" />

  <!-- Radial Glow Behind Head -->
  <circle cx="200" cy="190" r="160" fill="url(#neonGlow)" />

  <!-- Subtle Geometric Circuit Grid -->
  <path d="M 60 100 L 120 100 L 160 140" stroke="#06b6d4" stroke-opacity="0.15" stroke-width="2" fill="none" />
  <circle cx="160" cy="140" r="3" fill="#06b6d4" fill-opacity="0.3" />
  <path d="M 340 100 L 280 100 L 240 140" stroke="#3b82f6" stroke-opacity="0.15" stroke-width="2" fill="none" />
  <circle cx="240" cy="140" r="3" fill="#3b82f6" fill-opacity="0.3" />

  <!-- Body / Shoulders Silhouette -->
  <path d="M 100 450 C 100 360, 140 320, 200 320 C 260 320, 300 360, 300 450 Z" fill="#1e293b" stroke="url(#glowGrad)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Collar / Shirt Neckline -->
  <path d="M 175 320 L 200 365 L 225 320 Z" fill="#0f172a" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Neck -->
  <rect x="182" y="250" width="36" height="75" rx="8" fill="#334155" />

  <!-- Head / Face Silhouette -->
  <ellipse cx="200" cy="200" rx="60" ry="75" fill="#1e293b" stroke="url(#glowGrad)" stroke-width="2.5" />

  <!-- Modern Hairline -->
  <path d="M 142 180 C 142 125, 170 120, 200 120 C 230 120, 258 125, 258 180 C 250 150, 230 140, 200 140 C 170 140, 150 150, 142 180 Z" fill="url(#glowGrad)" />

  <!-- Stylized Monogram / Badge on Chest -->
  <g transform="translate(200, 200)">
    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="2">SK</text>
  </g>

  <!-- Bottom Name Banner in Silhouette -->
  <rect x="50" y="440" width="300" height="36" rx="12" fill="#020617" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
  <text x="200" y="463" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">SAAD KHAN • CSE AIML</text>
</svg>
